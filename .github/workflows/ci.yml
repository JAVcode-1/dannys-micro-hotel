name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ""
      SUPABASE_URL: ""
      SUPABASE_SECRET_KEY: ""
      TEST_DATABASE_URL: postgresql://staytrack_test:local_test_only@127.0.0.1:5432/staytrack_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: staytrack_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: staytrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staytrack_test -d staytrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: PostgreSQL integration — V02/V03 and O01–O03 booking/payment review
        run: npm run test:db
