<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FAFAFD" />
    <script>
      try {
        if (localStorage.getItem("staytrack-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#10172A";
        }
      } catch {
        // Storage can be unavailable in restricted browser contexts.
      }
    </script>
    <meta name="description" content="StayTrack at Danny's Micro Hotel" />
    <title>StayTrack - Danny's Micro Hotel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
